name: Nightly backup

# Copies the live database into a new snapshot in the backup database and
# applies the retention rule (docs/BACKUP.md). Needs two repository secrets:
# DATABASE_URL and BACKUP_DATABASE_URL.
#
# This repository is public, so this job's logs are public. The script prints
# counts and statuses only; GitHub also masks the secret values in the log.

on:
  schedule:
    # 20:30 UTC is 02:00 in India, when the shop is quietest. GitHub may start
    # a scheduled run some minutes late at busy times.
    - cron: '30 20 * * *'
  # "Run workflow" button in the Actions tab, for a test or an extra backup.
  workflow_dispatch: {}

# One backup at a time; a manual run queues behind a running one.
concurrency:
  group: nightly-backup
  cancel-in-progress: false

# The job only reads the code. It needs no write access to the repository.
permissions:
  contents: read

jobs:
  backup:
    name: Back up the database
    # Never run in a fork: forks have no secrets and this is not their data.
    if: github.repository == 'AkshayChavhan/saakie_byknk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backup
        run: pnpm run backup:nightly
